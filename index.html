<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Descarga directa · IPV - Mi Negocio</title>
  <!-- Estilos modernos y minimalistas -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(145deg, #f6f9fc 0%, #e9f1f8 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      padding: 1.5rem;
      margin: 0;
    }

    .card {
      max-width: 640px;
      width: 100%;
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 56px;
      box-shadow: 0 25px 50px -10px rgba(0, 20, 40, 0.25), 0 0 0 1px rgba(255, 255, 255, 0.6) inset;
      padding: 2.5rem 2rem;
      transition: transform 0.2s ease;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.4);
    }

    @media (max-width: 480px) {
      .card {
        padding: 2rem 1.5rem;
        border-radius: 40px;
      }
    }

    /* Logo / icono */
    .app-icon-wrapper {
      display: flex;
      justify-content: center;
      margin-bottom: 1.75rem;
    }

    .app-icon {
      width: 128px;
      height: 128px;
      border-radius: 32px;
      background: white;
      box-shadow: 0 12px 30px -8px rgba(0, 0, 0, 0.2), 0 0 0 1px rgba(0,0,0,0.02);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      overflow: hidden;
      padding: 8px;
    }

    .app-icon img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      border-radius: 24px;
    }

    .app-icon:hover {
      transform: scale(1.02);
    }

    h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #0b1e33;
      margin-bottom: 0.3rem;
      line-height: 1.2;
    }

    .subhead {
      font-size: 1rem;
      font-weight: 500;
      color: #3a5670;
      margin-bottom: 2rem;
      opacity: 0.8;
      letter-spacing: -0.01em;
      border-bottom: 1px solid rgba(60, 90, 120, 0.08);
      padding-bottom: 1.5rem;
    }

    .download-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      background: #1a2e44;
      color: white;
      border: none;
      padding: 1.1rem 2.8rem;
      border-radius: 80px;
      font-size: 1.25rem;
      font-weight: 600;
      font-family: inherit;
      letter-spacing: -0.01em;
      box-shadow: 0 10px 24px -6px rgba(20, 50, 80, 0.4);
      cursor: pointer;
      transition: all 0.2s ease;
      width: 100%;
      max-width: 380px;
      margin: 0 auto 1.2rem;
      border: 1px solid rgba(255, 255, 255, 0.1);
      text-decoration: none;
      color: white;
    }

    .download-btn:hover {
      background: #0f2238;
      transform: scale(1.01);
      box-shadow: 0 16px 30px -8px rgba(10, 40, 70, 0.5);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .download-btn:active {
      transform: scale(0.97);
      background: #0b1c2e;
    }

    .download-btn svg {
      width: 28px;
      height: 28px;
      fill: currentColor;
      flex-shrink: 0;
    }

    .info-note {
      font-size: 0.9rem;
      color: #2c4a66;
      background: rgba(220, 240, 255, 0.5);
      padding: 0.7rem 1rem;
      border-radius: 60px;
      display: inline-block;
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255, 255, 255, 0.5);
      margin-top: 0.5rem;
      font-weight: 500;
      letter-spacing: 0.2px;
    }

    .info-note span {
      opacity: 0.7;
      font-weight: 400;
    }

    .footer-meta {
      margin-top: 2.2rem;
      display: flex;
      justify-content: center;
      gap: 1.2rem;
      flex-wrap: wrap;
      font-size: 0.8rem;
      color: #3f5f7a;
      border-top: 1px solid rgba(60, 90, 120, 0.08);
      padding-top: 1.8rem;
    }

    .footer-meta a {
      color: #1f4462;
      text-decoration: none;
      font-weight: 500;
      padding: 0.2rem 0.6rem;
      border-radius: 40px;
      transition: background 0.15s;
    }

    .footer-meta a:hover {
      background: rgba(0, 40, 80, 0.06);
      text-decoration: underline;
    }

    .badge-drive {
      background: #eef4fa;
      border-radius: 40px;
      padding: 0.4rem 1rem;
      font-size: 0.75rem;
      font-weight: 600;
      color: #1f4b6e;
      letter-spacing: 0.3px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid rgba(255, 255, 255, 0.6);
    }

    .badge-drive svg {
      width: 14px;
      height: 14px;
      fill: #1f4b6e;
    }

    @media (max-width: 480px) {
      h1 { font-size: 1.7rem; }
      .download-btn { padding: 1rem 1.8rem; font-size: 1.1rem; }
      .app-icon { width: 100px; height: 100px; }
    }
  </style>
</head>
<body>

  <div class="card" role="main">
    <!-- Icono de la app -->
    <div class="app-icon-wrapper">
      <div class="app-icon">
        <img 
          src="https://images.icon-icons.com/1138/PNG/512/1486395307-17-store_80571.png" 
          alt="Icono de la aplicación IPV - Mi Negocio" 
          width="128" 
          height="128"
          loading="lazy"
        />
      </div>
    </div>

    <h1>IPV - Mi Negocio</h1>
    <p class="subhead">Descarga directa · APK</p>

    <!-- Botón de descarga directa a MediaFire -->
    <a 
      href="https://www.mediafire.com/file/fznotfnxvl5prsh/IPV+-+Mi+Negocio.apk/file" 
      class="download-btn" 
      id="downloadBtn"
      role="button"
      download
    >
      <!-- Icono SVG de descarga -->
      <svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6zM6 20V4h7v5h5v11H6z"/>
        <path d="M12 15l-4-4h2.5V8h3v3H16l-4 4z"/>
        <path d="M8 17h8v1.5H8V17z"/>
      </svg>
      <span>Descargar ahora (31.33 MB)</span>
    </a>

    <!-- Indicador de procedencia -->
    <div class="info-note">
      📦 <span>Alojado en MediaFire · Enlace permanente</span>
    </div>

    <!-- Metadatos adicionales -->
    <div class="footer-meta">
      <span class="badge-drive">
        <svg viewBox="0 0 24 24" width="14" height="14"><path d="M4.5 17.5l4.5-8 4.5 8H4.5zm9-10L18 15h-3.5l-3-5.5 3-5.5zM8 15H6l2-3.5L10 15H8z"/></svg>
        mediafire.com
      </span>
      <span style="opacity:0.5;">|</span>
      <span style="font-weight:400;">Subido: 2026-08-31</span>
    </div>
  </div>

  <script>
    (function() {
      const btn = document.getElementById('downloadBtn');
      if (btn) {
        btn.addEventListener('click', function(e) {
          // Pequeño efecto visual al hacer clic
          this.style.transform = 'scale(0.96)';
          setTimeout(() => { this.style.transform = ''; }, 150);
        });
      }
    })();
  </script>
</body>
</html>
